<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Control Panel — Markaz OUJ Performance</title>
<link rel="icon" href="ouj.png" sizes="any">
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;
       background:#0B1533;color:#fff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:420px;width:100%;text-align:center;background:#14245E;border-radius:20px;padding:36px 28px;
        box-shadow:0 24px 60px rgba(0,0,0,.35)}
  img{width:96px;height:auto;margin-bottom:14px}
  h1{font-size:22px;margin:0 0 8px}
  p{margin:0 0 22px;color:#C9D1EA}
  a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;
    background:#D9A62B;color:#0B1533;font-weight:800;text-decoration:none}
  a:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
  <main class="card">
    <img src="ouj.png" alt="Markaz OUJ Performance">
    <h1>The control panel has its own app now</h1>
    <p>Everything on this website — events, campuses, the store, orders and enquiries — is managed from the Markaz OUJ control panel.</p>
    <a id="go" href="https://admin-markaz-ouj.vercel.app">Open the control panel</a>
  </main>
</body>
</html>
